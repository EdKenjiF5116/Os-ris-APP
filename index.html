<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Osíris — Prontuário de Emergência</title>
<!-- 100% offline: ícones, gráficos e fontes embutidos -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-950:#020617;--bg-900:#0f172a;--bg-800:#1e293b;--bg-750:#243045;--bg-700:#334155;--bg-600:#475569;
  --text-50:#f8fafc;--text-100:#f1f5f9;--text-200:#e2e8f0;--text-300:#cbd5e1;--text-400:#94a3b8;--text-500:#64748b;
  --green-400:#34d399;--green-500:#10b981;--green-600:#059669;--green-700:#047857;--green-900:#064e3b;
  --blue-400:#60a5fa;--blue-500:#3b82f6;--blue-600:#2563eb;--blue-900:#1e3a8a;
  --red-400:#f87171;--red-500:#ef4444;--red-600:#dc2626;--red-700:#b91c1c;--red-900:#7f1d1d;
  --amber-400:#fbbf24;--amber-500:#f59e0b;--amber-600:#d97706;
  --orange-500:#f97316;--purple-500:#8b5cf6;--purple-600:#7c3aed;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;--mono:'SF Mono',SFMono-Regular,ui-monospace,'Cascadia Mono',Consolas,'Courier New',monospace;
  --r:12px;--r-sm:8px;--r-lg:16px;--r-xl:20px;--r-full:9999px;
}
body{font-family:var(--font);background:var(--bg-950);color:var(--text-50);min-height:100vh;overflow-x:hidden;font-size:14px;line-height:1.5}
input,textarea,select{font-family:var(--font);font-size:14px}
button{cursor:pointer;font-family:var(--font)}
a{text-decoration:none;color:inherit}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg-900)}
::-webkit-scrollbar-thumb{background:var(--bg-700);border-radius:4px}

/* ── ANIMATIONS ── */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{transform:translateX(-100%)}to{transform:translateX(0)}}
@keyframes blink{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.4)}70%{box-shadow:0 0 0 8px rgba(220,38,38,0)}}
@keyframes nfcPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.1);opacity:.7}}
.fade-in{animation:fadeIn .25s ease}
.pulse-red{animation:blink 1.5s infinite}

/* ── PUBLIC LAYOUT ── */
.public-bg{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;
  background:linear-gradient(135deg,#0f172a 0%,#1e293b 40%,#064e3b 100%);
  position:relative;overflow:hidden;
}
.public-bg::before{content:'';position:absolute;top:-100px;right:-100px;width:400px;height:400px;
  background:radial-gradient(circle,rgba(16,185,129,.15) 0%,transparent 70%);pointer-events:none}
.public-bg::after{content:'';position:absolute;bottom:-100px;left:-100px;width:350px;height:350px;
  background:radial-gradient(circle,rgba(59,130,246,.12) 0%,transparent 70%);pointer-events:none}

.pub-card{
  background:#fff;border-radius:var(--r-xl);padding:28px 24px;width:100%;max-width:380px;
  box-shadow:0 25px 60px rgba(0,0,0,.5);position:relative;z-index:1;animation:fadeIn .3s ease;
}
.pub-logo{text-align:center;margin-bottom:20px}
.pub-logo-icon{
  width:60px;height:60px;background:#0f172a;border-radius:var(--r-lg);margin:0 auto 10px;
  display:flex;align-items:center;justify-content:center;position:relative;border:2px solid #334155
}
.pub-logo-icon svg{color:#10b981}
.pub-logo h1{font-size:22px;font-weight:800;color:#0f172a;letter-spacing:-.5px}
.pub-logo p{font-size:12px;color:#64748b;font-weight:500}

/* ── TABS ── */
.tabs{display:flex;background:#f1f5f9;border-radius:var(--r);padding:3px;margin-bottom:20px}
.tab-btn{
  flex:1;padding:8px;border-radius:10px;border:none;background:transparent;
  font-size:13px;font-weight:600;color:#64748b;transition:.2s;display:flex;align-items:center;justify-content:center;gap:6px
}
.tab-btn.active{background:#fff;color:#0f172a;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.tab-btn.active.green{color:var(--green-600)}
.tab-btn.active.blue{color:var(--blue-600)}

/* ── FORM FIELDS ── */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:#374151;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.input{
  width:100%;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:var(--r-sm);
  font-size:14px;color:#0f172a;background:#fff;transition:.2s;outline:none
}
.input:focus{border-color:var(--green-500);box-shadow:0 0 0 3px rgba(16,185,129,.1)}
.input.blue:focus{border-color:var(--blue-500);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.input.error{border-color:var(--red-500)}
.input.success{border-color:var(--green-500)}
.input-wrap{position:relative}
.input-wrap .input{padding-right:40px}
.eye-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:#94a3b8;padding:4px}
.input-hint{font-size:11px;color:#94a3b8;margin-top:4px}

/* ── BUTTONS ── */
.btn{
  width:100%;padding:11px;border-radius:var(--r-sm);border:none;font-size:14px;font-weight:700;
  transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px
}
.btn-green{background:var(--green-500);color:#fff}
.btn-green:hover{background:var(--green-600)}
.btn-blue{background:var(--blue-500);color:#fff}
.btn-blue:hover{background:var(--blue-600)}
.btn-red{background:var(--red-600);color:#fff}
.btn-red:hover{background:var(--red-700)}
.btn-outline-green{background:transparent;color:var(--green-600);border:1.5px solid var(--green-500)}
.btn-outline-green:hover{background:rgba(16,185,129,.08)}
.btn-outline-blue{background:transparent;color:var(--blue-500);border:1.5px solid var(--blue-500)}
.btn-outline{background:transparent;color:#374151;border:1.5px solid #e2e8f0}
.btn-outline:hover{background:#f8fafc}
.btn + .btn{margin-top:10px}
.btn-sm{padding:7px 14px;font-size:12px;border-radius:var(--r-sm);border:none;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.btn-sm-green{background:var(--green-500);color:#fff}
.btn-sm-green:hover{background:var(--green-600)}
.btn-sm-blue{background:var(--blue-500);color:#fff}
.btn-sm-outline{background:transparent;border:1.5px solid var(--bg-700);color:var(--text-300)}

/* ── DEMO BOX ── */
.demo-box{background:#f8fafc;border-radius:var(--r-sm);padding:10px 12px;text-align:center;font-size:12px;color:#64748b;margin-top:10px}
.demo-box strong{color:#374151}

/* ── ERROR BOX ── */
.err-box{background:#fef2f2;border:1px solid #fecaca;border-radius:var(--r-sm);padding:10px 12px;
  font-size:12px;color:#dc2626;display:flex;align-items:center;gap:8px;margin-bottom:12px}

/* ── EMERGENCY BUTTONS (public) ── */
.pub-emergency{margin-top:16px;width:100%;max-width:380px;position:relative;z-index:1}
.emg-btn-patient{
  width:100%;padding:14px;background:var(--red-600);color:#fff;border:none;border-radius:var(--r);
  font-size:14px;font-weight:800;letter-spacing:.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  animation:blink 2s infinite
}
.emg-btn-doctor{
  width:100%;padding:14px;background:#c2410c;color:#fff;border:none;border-radius:var(--r);
  font-size:14px;font-weight:800;letter-spacing:.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  animation:blink 2s infinite
}
.pub-footer{margin-top:20px;text-align:center;font-size:11px;color:rgba(255,255,255,.4);position:relative;z-index:1}

/* ── PASSWORD STRENGTH ── */
.pw-criteria{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px;background:#f8fafc;padding:10px;border-radius:var(--r-sm)}
.pw-crit{font-size:11px;color:#94a3b8;display:flex;align-items:center;gap:5px;transition:.2s}
.pw-crit.ok{color:#059669}
.pw-crit svg{width:12px;height:12px;flex-shrink:0}

/* ── PILL TOGGLE ── */
.pill-toggle{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.pill{
  padding:6px 12px;border-radius:var(--r-full);border:1.5px solid #e2e8f0;background:#fff;
  font-size:12px;font-weight:600;color:#64748b;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:5px
}
.pill.active-green{background:var(--green-500);color:#fff;border-color:var(--green-500)}
.pill.active-blue{background:var(--blue-500);color:#fff;border-color:var(--blue-500)}

/* ── FORGOT PASSWORD STEPS ── */
.step-bar{display:flex;gap:4px;margin-bottom:20px}
.step-seg{flex:1;height:3px;background:#e2e8f0;border-radius:2px;transition:.4s}
.step-seg.done{background:var(--green-500)}
.code-inputs{display:flex;gap:8px;justify-content:center;margin:16px 0}
.code-input{
  width:44px;height:52px;text-align:center;font-size:20px;font-weight:700;font-family:var(--mono);
  border:2px solid #e2e8f0;border-radius:var(--r-sm);outline:none;transition:.2s;color:#0f172a
}
.code-input:focus{border-color:var(--green-500);box-shadow:0 0 0 3px rgba(16,185,129,.1)}

/* ── APP LAYOUT ── */
.app-layout{display:flex;min-height:100vh;background:var(--bg-950)}

/* ── SIDEBAR ── */
.sidebar{
  width:240px;min-height:100vh;background:var(--bg-900);border-right:1px solid var(--bg-700);
  display:flex;flex-direction:column;flex-shrink:0;
}
.sidebar-head{padding:16px;border-bottom:1px solid var(--bg-700);display:flex;align-items:center;justify-content:space-between}
.sidebar-logo{display:flex;align-items:center;gap:10px}
.sidebar-logo-icon{
  width:32px;height:32px;background:var(--green-600);border-radius:8px;
  display:flex;align-items:center;justify-content:center
}
.sidebar-logo span{font-size:16px;font-weight:800;color:var(--text-50)}
.sidebar-logo small{font-size:10px;color:var(--text-400);font-weight:500}
.close-sidebar{background:none;border:none;color:var(--text-400);display:none;padding:4px}

.sidebar-user{padding:14px 16px;border-bottom:1px solid var(--bg-700);display:flex;align-items:center;gap:10px}
.user-avatar{
  width:38px;height:38px;background:linear-gradient(135deg,var(--green-600),var(--green-400));
  border-radius:var(--r-full);display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;color:#fff;flex-shrink:0
}
.user-avatar.blue{background:linear-gradient(135deg,var(--blue-600),var(--blue-400))}
.user-info{min-width:0}
.user-info strong{font-size:13px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-info small{font-size:11px;color:var(--text-400);font-family:var(--mono)}

.sidebar-emg{padding:12px 16px;border-bottom:1px solid var(--bg-700)}
.sidebar-emg-btn{
  width:100%;padding:9px;background:var(--red-600);color:#fff;border:none;border-radius:var(--r-sm);
  font-size:12px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
  letter-spacing:.3px
}
.sidebar-emg-btn:hover{background:var(--red-700)}

.sidebar-nav{flex:1;padding:8px 0;overflow-y:auto}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 16px;color:var(--text-400);
  cursor:pointer;transition:.15s;border:none;background:none;width:100%;text-align:left;font-size:13px;font-weight:600
}
.nav-item:hover{background:var(--bg-800);color:var(--text-100)}
.nav-item.active{background:var(--green-600);color:#fff;border-radius:var(--r-sm);margin:0 8px;width:calc(100% - 16px)}
.nav-item.active.blue{background:var(--blue-600)}
.nav-item svg{flex-shrink:0;width:16px;height:16px}

.sidebar-foot{padding:12px 16px;border-top:1px solid var(--bg-700)}
.logout-btn{
  display:flex;align-items:center;gap:8px;padding:10px;color:var(--text-400);
  cursor:pointer;transition:.15s;border:none;background:none;width:100%;font-size:13px;font-weight:600;border-radius:var(--r-sm)
}
.logout-btn:hover{color:var(--red-400);background:rgba(239,68,68,.08)}

/* ── MOBILE HEADER ── */
.mob-header{
  display:none;position:sticky;top:0;z-index:50;background:var(--bg-900);border-bottom:1px solid var(--bg-700);
  padding:12px 16px;align-items:center;justify-content:space-between;
}
.mob-logo{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800}
.mob-logo-icon{width:28px;height:28px;background:var(--green-600);border-radius:7px;display:flex;align-items:center;justify-content:center}
.hamburger{background:none;border:none;color:var(--text-300);padding:4px}
.mob-emg{
  padding:7px 12px;background:var(--red-600);color:#fff;border:none;border-radius:var(--r-sm);
  font-size:11px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:5px;letter-spacing:.3px
}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none}
.overlay.open{display:block}

/* ── MAIN CONTENT ── */
.main{flex:1;overflow-y:auto;min-width:0}
.page{padding:20px;max-width:600px;margin:0 auto;animation:fadeIn .2s ease}
.page-hd{margin-bottom:20px}
.page-hd h1{font-size:24px;font-weight:800;letter-spacing:-.5px}
.page-hd p{font-size:13px;color:var(--text-400);margin-top:3px}

/* ── APP HEADER (inner pages) ── */
.app-bar{
  position:sticky;top:0;background:var(--bg-900);border-bottom:1px solid var(--bg-700);
  padding:12px 20px;display:flex;align-items:center;justify-content:space-between;z-index:10
}
.app-bar-left{display:flex;align-items:center;gap:10px}
.app-bar-logo{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800}
.app-bar-logo-icon{width:28px;height:28px;background:var(--green-600);border-radius:7px;display:flex;align-items:center;justify-content:center}
.emg-pill{
  padding:6px 12px;background:var(--red-600);color:#fff;border:none;border-radius:var(--r-sm);
  font-size:11px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:5px;
  animation:blink 2s infinite;letter-spacing:.3px
}

/* ── STAT CARDS ── */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.stat-card{background:var(--bg-900);border:1px solid var(--bg-700);border-radius:var(--r);padding:14px}
.stat-card svg{width:20px;height:20px;margin-bottom:8px}
.stat-card .stat-val{font-size:26px;font-weight:800;line-height:1}
.stat-card .stat-lbl{font-size:11px;color:var(--text-400);margin-top:4px;font-weight:500}
.stat-card.blue svg{color:var(--blue-400)}
.stat-card.green svg{color:var(--green-400)}
.stat-card.red svg{color:var(--red-400)}
.stat-card.amber svg{color:var(--amber-400)}
.stat-card.purple svg{color:var(--purple-500)}

/* ── KPI CARDS (patient) ── */
.kpi-card{
  background:var(--bg-900);border:1px solid var(--bg-700);border-radius:var(--r);padding:14px;
  border-left:3px solid var(--green-500);position:relative;overflow:hidden
}
.kpi-card.yellow{border-left-color:var(--amber-500)}
.kpi-card.red{border-left-color:var(--red-500)}
.kpi-card.blue{border-left-color:var(--blue-500)}
.kpi-card.pink{border-left-color:#ec4899}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.kpi-top svg{width:18px;height:18px}
.kpi-val{font-size:24px;font-weight:800}
.kpi-lbl{font-size:11px;color:var(--text-400);font-weight:500}

/* ── SECTION HEADERS ── */
.sect-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;margin-top:20px}
.sect-hd h2{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px}
.sect-hd h2 svg{width:16px;height:16px}
.sect-count{font-size:12px;color:var(--text-500);font-weight:500}

/* ── CARDS ── */
.card{background:var(--bg-900);border:1px solid var(--bg-700);border-radius:var(--r);padding:14px;margin-bottom:10px;cursor:pointer;transition:.15s}
.card:hover{border-color:var(--bg-600);background:var(--bg-800)}
.card.critical{border-left:3px solid var(--red-600)}
.card.urgent{border-left:3px solid var(--amber-500)}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:var(--r-full);font-size:11px;font-weight:700;letter-spacing:.2px}
.badge-red{background:rgba(220,38,38,.2);color:var(--red-400)}
.badge-amber{background:rgba(245,158,11,.2);color:var(--amber-400)}
.badge-green{background:rgba(16,185,129,.2);color:var(--green-400)}
.badge-blue{background:rgba(59,130,246,.2);color:var(--blue-400)}
.badge-purple{background:rgba(139,92,246,.2);color:var(--purple-500)}
.badge-gray{background:var(--bg-700);color:var(--text-300)}
.badge-orange{background:rgba(249,115,22,.2);color:var(--orange-500)}
.badge-pulse{animation:blink 1.5s infinite}
.badge-urgent{background:rgba(220,38,38,.2);color:var(--red-400);animation:blink 1.5s infinite}

/* ── EMERGENCY PAGES ── */
.emg-page{min-height:100vh;background:var(--bg-950)}
.emg-header{
  background:var(--red-600);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:10
}
.emg-header h1{font-size:16px;font-weight:900;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.emg-header svg{width:20px;height:20px}
.emg-sub{background:rgba(185,28,28,.8);padding:10px 16px;text-align:center;font-size:12px;color:#fca5a5}
.emg-body{padding:16px;max-width:480px;margin:0 auto}
.emg-card{background:var(--bg-900);border:1px solid var(--bg-700);border-radius:var(--r);padding:16px;margin-bottom:14px}
.emg-card-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.emg-icon{width:36px;height:36px;background:rgba(220,38,38,.2);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.emg-icon svg{width:18px;height:18px;color:var(--red-400)}
.emg-field{margin-bottom:14px}
.emg-field label{display:block;font-size:12px;font-weight:700;color:var(--text-300);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.emg-input{
  width:100%;padding:10px 12px;border:1.5px solid var(--bg-700);border-radius:var(--r-sm);
  font-size:14px;color:var(--text-50);background:var(--bg-800);transition:.2s;outline:none
}
.emg-input:focus{border-color:var(--red-500);box-shadow:0 0 0 3px rgba(220,38,38,.15)}
.emg-input.success{border-color:var(--green-500)}
.emg-select{
  width:100%;padding:10px 12px;border:1.5px solid var(--bg-700);border-radius:var(--r-sm);
  font-size:14px;color:var(--text-50);background:var(--bg-800);outline:none;cursor:pointer
}
.emg-textarea{
  width:100%;padding:10px 12px;border:1.5px solid var(--bg-700);border-radius:var(--r-sm);
  font-size:14px;color:var(--text-50);background:var(--bg-800);outline:none;resize:vertical;min-height:80px
}
.emg-textarea:focus{border-color:var(--red-500)}

.method-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:0}
.method-card{
  background:var(--bg-800);border:2px solid var(--bg-700);border-radius:var(--r);
  padding:14px;text-align:center;cursor:pointer;transition:.2s
}
.method-card.active{border-color:var(--red-500);background:rgba(220,38,38,.1)}
.method-card svg{width:28px;height:28px;color:var(--text-400);margin-bottom:6px}
.method-card.active svg{color:var(--red-400)}
.method-card p{font-size:12px;font-weight:700;color:var(--text-300)}
.method-card.active p{color:var(--red-300)}

.nfc-btn{
  width:100%;padding:14px;background:var(--bg-800);border:2px dashed var(--bg-600);border-radius:var(--r);
  color:var(--text-300);font-size:14px;font-weight:700;cursor:pointer;transition:.2s;
  display:flex;align-items:center;justify-content:center;gap:10px
}
.nfc-btn:hover{border-color:var(--text-400)}
.nfc-btn.reading{border-color:var(--amber-500);color:var(--amber-400);animation:nfcPulse 1s infinite}
.nfc-btn svg{width:20px;height:20px}
.nfc-result{background:rgba(16,185,129,.1);border:1.5px solid var(--green-500);border-radius:var(--r-sm);padding:10px;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13px;color:var(--green-400)}

.samu-bar{background:var(--bg-800);border:1px solid var(--bg-700);border-radius:var(--r-sm);padding:10px 14px;
  display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-size:12px;color:var(--text-400)}
.samu-link{color:var(--red-400);font-weight:700;font-size:13px}

.emg-activate{
  width:100%;padding:16px;background:var(--red-600);color:#fff;border:none;border-radius:var(--r);
  font-size:15px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  letter-spacing:.5px;transition:.2s
}
.emg-activate:hover{background:var(--red-700)}
.back-link{text-align:center;margin-top:14px;font-size:13px;color:var(--text-400);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.back-link:hover{color:var(--text-200)}

/* ── EMERGENCY LOADING / CONFIRM ── */
.emg-loading{min-height:100vh;background:#1a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.emg-loading svg{width:60px;height:60px;color:var(--red-400);animation:nfcPulse 1s infinite}
.emg-loading h2{font-size:18px;font-weight:800;color:var(--red-300)}
.dots{display:flex;gap:6px}
.dot{width:8px;height:8px;background:var(--red-400);border-radius:50%;animation:pulse 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}

.emg-confirm{min-height:100vh;background:#052e16;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.emg-confirm-icon{width:70px;height:70px;background:rgba(16,185,129,.2);border-radius:var(--r-full);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.emg-confirm-icon svg{width:36px;height:36px;color:var(--green-400)}
.emg-confirm h2{font-size:20px;font-weight:800;color:var(--green-400);margin-bottom:6px}
.emg-confirm p{font-size:13px;color:var(--text-400);text-align:center;margin-bottom:20px}
.protocol-num{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--green-300);background:rgba(16,185,129,.1);border:1px solid var(--green-700);padding:8px 16px;border-radius:var(--r-sm);margin-bottom:20px}
.confirm-info{background:var(--bg-900);border:1px solid var(--bg-700);border-radius:var(--r);padding:14px;width:100%;max-width:380px;margin-bottom:16px}
.confirm-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:6px}
.confirm-row:last-child{margin-bottom:0}
.confirm-row span:first-child{color:var(--text-400)}
.confirm-row span:last-child{font-weight:600}

/* ── EMERGENCY DATA PAGE ── */
.emg-data-page{background:var(--bg-950);min-height:100vh}
.emg-data-hd{background:var(--red-700);padding:14px 16px;position:sticky;top:0;z-index:10}
.emg-data-hd h1{font-size:14px;font-weight:900;letter-spacing:.5px;display:flex;align-items:center;gap:7px}
.emg-data-hd h1 svg{width:18px;height:18px;animation:nfcPulse 1.5s infinite}
.emg-data-sub{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:11px}
.emg-data-sub span{background:rgba(255,255,255,.15);padding:3px 8px;border-radius:4px;font-family:var(--mono)}
.emg-data-body{padding:14px;max-width:600px;margin:0 auto}
.vital-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:0}
.vital-item{background:var(--bg-800);border-radius:var(--r-sm);padding:10px}
.vital-item .vital-lbl{font-size:10px;color:var(--text-400);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.vital-item .vital-val{font-size:18px;font-weight:800;font-family:var(--mono)}
.allergy-card{background:rgba(185,28,28,.15);border:1px solid rgba(220,38,38,.3);border-radius:var(--r-sm);padding:10px;margin-bottom:8px}
.allergy-sev{display:inline-flex;align-items:center;padding:2px 7px;border-radius:var(--r-full);font-size:10px;font-weight:700}
.allergy-sev.grave{background:rgba(220,38,38,.3);color:var(--red-400)}
.allergy-sev.moderada{background:rgba(249,115,22,.3);color:var(--orange-500)}
.allergy-sev.leve{background:rgba(245,158,11,.3);color:var(--amber-400)}
.emg-warn{background:rgba(245,158,11,.1);border:1px solid var(--amber-600);border-radius:var(--r-sm);padding:10px 12px;font-size:11px;color:var(--amber-400);margin-top:14px;display:flex;align-items:flex-start;gap:8px}
.emg-warn svg{width:14px;height:14px;flex-shrink:0;margin-top:1px}

/* ── MODAL ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;
  animation:fadeIn .15s ease
}
.modal{background:var(--bg-900);border:1px solid var(--bg-700);border-radius:var(--r-xl);width:100%;max-width:420px;max-height:90vh;overflow-y:auto}
.modal-hd{
  background:var(--bg-800);padding:14px 16px;border-radius:var(--r-xl) var(--r-xl) 0 0;
  display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:1
}
.modal-hd-icon{width:36px;height:36px;background:rgba(220,38,38,.2);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-hd-icon svg{width:18px;height:18px;color:var(--red-400)}
.modal-hd h2{font-size:15px;font-weight:800;flex:1}
.modal-hd small{font-size:11px;color:var(--text-400);font-family:var(--mono)}
.close-modal{background:none;border:none;color:var(--text-400);cursor:pointer;padding:4px;margin-left:auto}
.modal-body{padding:14px}
.modal-sect{background:var(--bg-800);border-radius:var(--r-sm);padding:12px;margin-bottom:10px}
.modal-sect h3{font-size:12px;font-weight:700;color:var(--text-300);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.data-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.data-item .data-lbl{font-size:10px;color:var(--text-500);font-weight:500;margin-bottom:2px}
.data-item .data-val{font-size:14px;font-weight:700}
.data-item .data-val.green{color:var(--green-400)}
.vitals-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vitem .vlbl{font-size:10px;color:var(--text-500);margin-bottom:1px}
.vitem .vval{font-size:16px;font-weight:800;font-family:var(--mono)}
.proc-list li{font-size:13px;color:var(--text-200);display:flex;align-items:center;gap:7px;margin-bottom:5px}
.proc-list li svg{width:14px;height:14px;color:var(--green-400);flex-shrink:0}
.outcome-box{background:rgba(16,185,129,.1);border:1px solid var(--green-700);border-radius:var(--r-sm);padding:10px;font-size:13px;color:var(--green-300)}

/* ── CHARTS ── */
.chart-wrap{background:var(--bg-900);border:1px solid var(--bg-700);border-radius:var(--r);padding:14px;margin-bottom:12px}
.chart-wrap h3{font-size:12px;font-weight:700;color:var(--text-300);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.chart-wrap canvas{max-height:140px}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:500px){.charts-grid{grid-template-columns:1fr}}

/* ── HISTORY TIMELINE ── */
.timeline{position:relative;padding-left:20px}
.timeline::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--bg-700)}
.tl-item{position:relative;margin-bottom:16px}
.tl-dot{
  position:absolute;left:-17px;top:14px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg-950);
  background:var(--green-500);
}
.tl-dot.amber{background:var(--amber-500)}
.tl-dot.red{background:var(--red-500)}
.tl-card{background:var(--bg-900);border:1px solid var(--bg-700);border-radius:var(--r);padding:12px}
.tl-card .tl-title{font-size:14px;font-weight:700;margin-bottom:4px}
.tl-card .tl-meta{font-size:11px;color:var(--text-400);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{background:var(--bg-700);color:var(--text-300);font-size:11px;padding:3px 8px;border-radius:var(--r-full);font-weight:500}

/* ── SEARCH ── */
.search-bar{
  display:flex;align-items:center;gap:8px;background:var(--bg-800);border:1.5px solid var(--bg-700);
  border-radius:var(--r);padding:10px 12px;margin-bottom:14px;color:var(--text-400)
}
.search-bar svg{width:16px;height:16px;flex-shrink:0}
.search-bar input{background:none;border:none;outline:none;color:var(--text-50);font-size:13px;flex:1;font-family:var(--font)}
.search-bar input::placeholder{color:var(--text-500)}

/* ── FILTER PILLS ── */
.filter-row{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.filter-pill{
  padding:6px 14px;border-radius:var(--r-full);font-size:12px;font-weight:600;
  border:none;cursor:pointer;white-space:nowrap;transition:.15s;background:var(--bg-800);color:var(--text-400)
}
.filter-pill.active{background:var(--green-600);color:#fff}

/* ── APPOINTMENT ITEM ── */
.appt-item{background:var(--bg-900);border:1px solid var(--bg-700);border-radius:var(--r);padding:12px;margin-bottom:8px;display:flex;gap:12px}
.appt-date{text-align:center;background:var(--bg-800);border-radius:var(--r-sm);padding:8px 10px;min-width:50px;flex-shrink:0}
.appt-date .day{font-size:20px;font-weight:800;line-height:1}
.appt-date .month{font-size:10px;color:var(--text-400);text-transform:uppercase;font-weight:600}
.appt-date .time{font-size:11px;color:var(--text-300);margin-top:4px;font-family:var(--mono)}
.appt-info{flex:1;min-width:0}
.appt-info .name{font-size:14px;font-weight:700}
.appt-info .sub{font-size:12px;color:var(--text-400);margin-top:2px}
.appt-info .loc{font-size:11px;color:var(--text-500);margin-top:3px}
.appt-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;align-items:center}

/* ── EXAM ITEM ── */
.exam-item{background:var(--bg-900);border:1px solid var(--bg-700);border-radius:var(--r);padding:12px;margin-bottom:8px}
.exam-item.urgent{border-left:3px solid var(--red-600)}
.exam-icon{width:36px;height:36px;background:rgba(245,158,11,.15);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.exam-icon svg{width:18px;height:18px;color:var(--amber-400)}
.exam-icon.green{background:rgba(16,185,129,.15)}
.exam-icon.green svg{color:var(--green-400)}
.exam-icon.red{background:rgba(220,38,38,.15)}
.exam-icon.red svg{color:var(--red-400)}
.exam-row{display:flex;gap:10px;align-items:flex-start}
.exam-info{flex:1}
.exam-info .exam-name{font-size:14px;font-weight:700}
.exam-info .exam-sub{font-size:12px;color:var(--text-400);margin-top:2px}
.exam-result{background:rgba(16,185,129,.1);border:1px solid var(--green-700);border-radius:4px;padding:4px 8px;font-size:11px;color:var(--green-400);font-weight:600;margin-top:6px;display:inline-block}

/* ── PATIENT CARD (history) ── */
.patient-card{background:var(--bg-900);border:1px solid var(--bg-700);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.patient-card-hd{padding:12px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:.15s}
.patient-card-hd:hover{background:var(--bg-800)}
.patient-card-body{background:var(--bg-800);padding:12px;border-top:1px solid var(--bg-700)}
.pav{width:38px;height:38px;border-radius:var(--r-full);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}
.pav.blue{background:linear-gradient(135deg,var(--blue-600),var(--blue-400));color:#fff}
.pav.green{background:linear-gradient(135deg,var(--green-600),var(--green-400));color:#fff}

/* ── VACCINE CARD ── */
.vac-card{background:var(--bg-900);border:1px solid var(--bg-700);border-radius:var(--r);padding:12px;margin-bottom:8px}
.vac-card.pending{border-left:3px solid var(--amber-500)}
.vac-row{display:flex;align-items:center;gap:10px}
.vac-icon{width:36px;height:36px;background:rgba(16,185,129,.15);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.vac-icon svg{width:18px;height:18px;color:var(--green-400)}
.vac-icon.amber{background:rgba(245,158,11,.15)}
.vac-icon.amber svg{color:var(--amber-400)}
.vac-info{flex:1}
.vac-info .vac-name{font-size:14px;font-weight:700}
.vac-info .vac-sub{font-size:11px;color:var(--text-400);margin-top:2px}
.vac-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;font-size:11px;color:var(--text-400)}
.vac-meta span strong{color:var(--text-200);font-weight:600}

/* ── DOCTOR CARD ── */
.doc-card{background:var(--bg-900);border:1px solid var(--bg-700);border-radius:var(--r);padding:14px;margin-bottom:10px}
.doc-card-hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.doc-av{width:44px;height:44px;border-radius:var(--r-full);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex-shrink:0}
.doc-av.green{background:linear-gradient(135deg,var(--green-700),var(--green-400));color:#fff}
.doc-av.blue{background:linear-gradient(135deg,var(--blue-600),var(--blue-400));color:#fff}
.doc-info .name{font-size:15px;font-weight:700}
.doc-info .spec{font-size:12px;color:var(--green-400);font-weight:600}
.doc-info .spec.blue{color:var(--blue-400)}
.doc-info .crm{font-size:11px;color:var(--text-500);font-family:var(--mono)}
.stars{color:var(--amber-400);font-size:13px;margin-top:2px}
.doc-contacts{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text-400);margin-bottom:10px}
.doc-contacts span{display:flex;align-items:center;gap:6px}
.doc-contacts span svg{width:13px;height:13px;flex-shrink:0}
.doc-contacts a{color:var(--text-300)}
.doc-appt{background:rgba(16,185,129,.08);border:1px solid var(--green-700);border-radius:var(--r-sm);padding:8px 10px;font-size:12px;color:var(--green-400);display:flex;align-items:center;gap:6px;margin-bottom:8px}
.doc-appt svg{width:13px;height:13px}
.doc-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ── INSURANCE PAGE ── */
.plan-card{background:linear-gradient(135deg,var(--green-700),#0d9488);border-radius:var(--r-xl);padding:20px;margin-bottom:16px;position:relative;overflow:hidden}
.plan-card::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;background:rgba(255,255,255,.08);border-radius:50%}
.plan-card::after{content:'';position:absolute;bottom:-20px;left:20px;width:80px;height:80px;background:rgba(255,255,255,.05);border-radius:50%}
.plan-name{font-size:20px;font-weight:800;margin:8px 0 2px}
.plan-num{font-family:var(--mono);font-size:14px;letter-spacing:3px;opacity:.8;margin:6px 0}
.plan-row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px;font-size:12px;opacity:.8}

/* ── CONVENIO CARD ── */
.conv-card{background:var(--bg-900);border:1px solid var(--bg-700);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.conv-hd{padding:12px 14px;display:flex;align-items:center;justify-content:space-between}
.conv-hd .conv-name{font-size:15px;font-weight:800}
.conv-hd .conv-code{font-size:11px;color:rgba(255,255,255,.7);font-family:var(--mono)}
.conv-body{padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.conv-stat{text-align:center}
.conv-stat .num{font-size:20px;font-weight:800}
.conv-stat .lbl{font-size:10px;color:var(--text-400);text-transform:uppercase}
.conv-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 12px}

/* ── WEEKLY CALENDAR ── */
.week-cal{background:var(--bg-900);border:1px solid var(--bg-700);border-radius:var(--r);padding:14px;margin-bottom:14px}
.week-cal h3{font-size:12px;font-weight:700;color:var(--text-400);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.week-days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.week-day{
  display:flex;flex-direction:column;align-items:center;padding:8px;min-width:44px;
  background:var(--bg-800);border-radius:var(--r-sm);cursor:pointer;transition:.15s;border:2px solid transparent;flex-shrink:0
}
.week-day:hover{border-color:var(--bg-600)}
.week-day.today{background:var(--green-600);border-color:var(--green-500)}
.week-day .wd-abbr{font-size:10px;font-weight:600;text-transform:uppercase;color:var(--text-400)}
.week-day.today .wd-abbr{color:rgba(255,255,255,.8)}
.week-day .wd-num{font-size:18px;font-weight:800;line-height:1.1}
.week-day .wd-count{font-size:10px;color:var(--text-400);margin-top:2px}
.week-day.today .wd-count{color:rgba(255,255,255,.7)}

/* ── CONSULTATION ITEM (doctor list) ── */
.consult-item{background:var(--bg-900);border:1px solid var(--bg-700);border-radius:var(--r);padding:12px;margin-bottom:8px}
.consult-item.urgent-border{border-left:3px solid var(--red-600)}
.consult-time{background:var(--bg-700);border-radius:var(--r-sm);padding:4px 10px;font-size:12px;font-weight:700;font-family:var(--mono);display:inline-block;margin-bottom:8px}
.consult-name{font-size:14px;font-weight:700;margin-bottom:2px}
.consult-sub{font-size:12px;color:var(--text-400)}
.consult-actions{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}

/* ── ALERT BOX ── */
.alert-box{border-radius:var(--r-sm);padding:10px 12px;margin-bottom:14px;display:flex;align-items:flex-start;gap:8px;font-size:12px}
.alert-box svg{width:14px;height:14px;flex-shrink:0;margin-top:1px}
.alert-amber{background:rgba(245,158,11,.1);border:1px solid var(--amber-600);color:var(--amber-400)}
.alert-red{background:rgba(220,38,38,.1);border:1px solid var(--red-700);color:var(--red-400)}
.alert-green{background:rgba(16,185,129,.1);border:1px solid var(--green-700);color:var(--green-400)}

/* ── ADD FORM ── */
.add-form{background:var(--bg-900);border:1px solid var(--bg-700);border-radius:var(--r);padding:14px;margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.app-field{margin-bottom:0}
.app-field label{display:block;font-size:11px;font-weight:700;color:var(--text-400);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.app-input{
  width:100%;padding:9px 10px;border:1.5px solid var(--bg-700);border-radius:var(--r-sm);
  font-size:13px;color:var(--text-50);background:var(--bg-800);outline:none;transition:.2s
}
.app-input:focus{border-color:var(--green-500)}
.app-select{
  width:100%;padding:9px 10px;border:1.5px solid var(--bg-700);border-radius:var(--r-sm);
  font-size:13px;color:var(--text-50);background:var(--bg-800);outline:none;cursor:pointer
}
.app-textarea{
  width:100%;padding:9px 10px;border:1.5px solid var(--bg-700);border-radius:var(--r-sm);
  font-size:13px;color:var(--text-50);background:var(--bg-800);outline:none;resize:vertical;min-height:70px;grid-column:1/-1
}
.form-actions{display:flex;gap:8px;margin-top:10px;grid-column:1/-1}

/* ── QUICK ACTIONS ── */
.quick-actions{background:var(--bg-900);border:1px solid var(--bg-700);border-radius:var(--r);overflow:hidden}
.quick-item{
  display:flex;align-items:center;justify-content:space-between;padding:12px 14px;
  border-bottom:1px solid var(--bg-700);cursor:pointer;transition:.15s
}
.quick-item:last-child{border-bottom:none}
.quick-item:hover{background:var(--bg-800)}
.quick-item .qi-title{font-size:13px;font-weight:700}
.quick-item .qi-sub{font-size:11px;color:var(--text-400);margin-top:1px}
.quick-item svg{width:14px;height:14px;color:var(--text-500)}

/* ── COVERAGE GRID ── */
.coverage-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.cov-item{background:rgba(5,150,105,.12);border:1px solid var(--green-700);border-radius:var(--r-sm);padding:10px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.cov-check{width:16px;height:16px;background:var(--green-500);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cov-check svg{width:10px;height:10px;color:#fff}

/* ── SUCCESS BANNER ── */
.success-banner{background:rgba(16,185,129,.1);border:1px solid var(--green-700);border-radius:var(--r-sm);padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--green-400);margin-bottom:12px}

/* ── CODE BOX ── */
.code-box{
  text-align:center;font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:6px;
  color:var(--text-50);background:var(--bg-800);border:1.5px solid var(--bg-700);border-radius:var(--r-sm);
  padding:12px;margin:8px 0;text-transform:uppercase
}
.code-box::placeholder{font-size:14px;letter-spacing:2px;color:var(--text-500)}

/* ── RESPONSIVE ── */
@media(max-width:640px){
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%);transition:.25s;
    box-shadow:4px 0 20px rgba(0,0,0,.5)
  }
  .sidebar.open{transform:translateX(0);animation:slideIn .25s ease}
  .close-sidebar{display:block}
  .mob-header{display:flex}
  .app-bar{display:none}
  .form-grid{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:1fr 1fr}
}
@media(min-width:641px){
  .hamburger{display:none}
  .overlay{display:none!important}
}

.demo-accounts h4{font-size:11px;font-weight:800;color:#374151;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.demo-row{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;color:#64748b}
.demo-row strong{color:#0f172a;font-family:monospace}
.succ-box{background:#f0fdf4;border:1px solid #86efac;border-radius:var(--r-sm);padding:10px 12px;font-size:12px;color:#16a34a;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.code-verified{background:rgba(16,185,129,.1);border:1px solid var(--green-700);border-radius:var(--r-sm);padding:10px;margin-top:8px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--green-400)}
.code-invalid{background:rgba(220,38,38,.1);border:1px solid var(--red-700);border-radius:var(--r-sm);padding:10px;margin-top:8px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--red-400)}
.nfc-btn.success-nfc{border-color:var(--green-500);color:var(--green-400);background:rgba(16,185,129,.08);animation:none}

function svgLineChart(elId, opts){
  var el=document.getElementById(elId); if(!el) return;
  var W=el.clientWidth||300, H=150, padL=34, padR=8, padT=10, padB=20;
  var labels=opts.labels, series=opts.series; // series: [{data,color,fill,label}]
  var refs=opts.refs||[]; // [{y,color,label}]
  var all=[];
  series.forEach(function(s){all=all.concat(s.data);});
  refs.forEach(function(r){all.push(r.y);});
  var min=Math.min.apply(null,all), max=Math.max.apply(null,all);
  var range=(max-min)||1; min-=range*0.15; max+=range*0.15; range=max-min;
  var iw=W-padL-padR, ih=H-padT-padB;
  function X(i){return padL+iw*(labels.length>1?i/(labels.length-1):0.5);}
  function Y(v){return padT+ih*(1-(v-min)/range);}
  var s='<svg width="100%" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="display:block">';
  // gridlines (4)
  for(var g=0;g<=3;g++){
    var gv=min+range*g/3, gy=Y(gv);
    s+='<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'" stroke="rgba(255,255,255,.06)"/>';
    s+='<text x="'+(padL-5)+'" y="'+(gy+3)+'" fill="#64748b" font-size="9" text-anchor="end">'+Math.round(gv)+'</text>';
  }
  // x labels
  labels.forEach(function(l,i){
    s+='<text x="'+X(i)+'" y="'+(H-5)+'" fill="#64748b" font-size="9" text-anchor="middle">'+l+'</text>';
  });
  // reference lines
  refs.forEach(function(r){
    var ry=Y(r.y);
    s+='<line x1="'+padL+'" y1="'+ry+'" x2="'+(W-padR)+'" y2="'+ry+'" stroke="'+r.color+'" stroke-width="1" stroke-dasharray="4 3" opacity=".7"/>';
    if(r.label) s+='<text x="'+(W-padR-2)+'" y="'+(ry-3)+'" fill="'+r.color+'" font-size="8" text-anchor="end" opacity=".9">'+r.label+'</text>';
  });
  // series
  series.forEach(function(sr){
    var pts=sr.data.map(function(v,i){return X(i)+','+Y(v);});
    if(sr.fill){
      s+='<path d="M'+X(0)+','+Y(sr.data[0])+' L'+pts.join(' L')+' L'+X(sr.data.length-1)+','+(H-padB)+' L'+X(0)+','+(H-padB)+' Z" fill="'+sr.color+'" opacity=".12"/>';
    }
    s+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+sr.color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
    sr.data.forEach(function(v,i){
      s+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="3" fill="'+sr.color+'"><title>'+labels[i]+': '+v+(opts.unit?' '+opts.unit:'')+'</title></circle>';
    });
  });
  s+='</svg>';
  // legend
  if(series.length>1){
    s+='<div style="display:flex;gap:12px;justify-content:center;margin-top:4px">';
    series.forEach(function(sr){
      s+='<span style="font-size:10px;color:#94a3b8;display:flex;align-items:center;gap:4px"><span style="width:10px;height:3px;background:'+sr.color+';border-radius:2px;display:inline-block"></span>'+(sr.label||'')+'</span>';
    });
    s+='</div>';
  }
  el.innerHTML=s;
}

function svgBarChart(elId, opts){
  var el=document.getElementById(elId); if(!el) return;
  var W=el.clientWidth||300, H=150, padL=34, padR=8, padT=10, padB=20;
  var labels=opts.labels, groups=opts.groups; // groups: [{data,colors,label,opacity}]
  var all=[]; groups.forEach(function(g){all=all.concat(g.data);});
  var max=Math.max.apply(null,all)*1.15, min=0, range=max;
  var iw=W-padL-padR, ih=H-padT-padB;
  var n=labels.length, slot=iw/n, bw=Math.min(18,(slot-8)/groups.length);
  function Y(v){return padT+ih*(1-(v-min)/range);}
  var s='<svg width="100%" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="display:block">';
  for(var g=0;g<=3;g++){
    var gv=min+range*g/3, gy=Y(gv);
    s+='<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'" stroke="rgba(255,255,255,.06)"/>';
    s+='<text x="'+(padL-5)+'" y="'+(gy+3)+'" fill="#64748b" font-size="9" text-anchor="end">'+Math.round(gv)+'</text>';
  }
  labels.forEach(function(l,i){
    var cx=padL+slot*i+slot/2;
    s+='<text x="'+cx+'" y="'+(H-5)+'" fill="#64748b" font-size="9" text-anchor="middle">'+l+'</text>';
    groups.forEach(function(gr,gi){
      var v=gr.data[i];
      var x=cx-(groups.length*bw)/2+gi*bw;
      var y=Y(v), h=(H-padB)-y;
      var color=gr.colors?gr.colors[i]:gr.color;
      s+='<rect x="'+x+'" y="'+y+'" width="'+(bw-2)+'" height="'+h+'" rx="3" fill="'+color+'" opacity="'+(gr.opacity||1)+'"><title>'+l+' ('+(gr.label||'')+'): '+v+'</title></rect>';
    });
  });
  s+='</svg>';
  if(groups.length>1){
    s+='<div style="display:flex;gap:12px;justify-content:center;margin-top:4px">';
    groups.forEach(function(gr){
      s+='<span style="font-size:10px;color:#94a3b8;display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;background:'+(gr.colors?gr.colors[0]:gr.color)+';opacity:'+(gr.opacity||1)+';border-radius:2px;display:inline-block"></span>'+(gr.label||'')+'</span>';
    });
    s+='</div>';
  }
  el.innerHTML=s;
}

// ══ SAFE STORAGE (localStorage com fallback em memória) ══
// Em alguns ambientes (sandbox, file://, visualizadores) localStorage lança
// SecurityError. Este wrapper usa localStorage quando disponível e cai para
// um objeto em memória quando não, garantindo que o app sempre funcione.
const Store = (function(){
  let useLS = false;
  try {
    const t='__peb_test__';
    window.localStorage.setItem(t,'1');
    window.localStorage.removeItem(t);
    useLS = true;
  } catch(e) { useLS = false; }
  const mem = {};
  return {
    get(k){
      if(useLS){ try { return window.localStorage.getItem(k); } catch(e){ return mem[k]??null; } }
      return mem[k]??null;
    },
    set(k,v){
      if(useLS){ try { window.localStorage.setItem(k,v); return; } catch(e){} }
      mem[k]=v;
    },
    remove(k){
      if(useLS){ try { window.localStorage.removeItem(k); return; } catch(e){} }
      delete mem[k];
    }
  };
})();

// ══ DB ══
function initDB(){
  if(!Store.get('peb_patients')){
    Store.set('peb_patients', JSON.stringify(DEFAULT_PATIENTS));
  }
  if(!Store.get('peb_doctors')){
    Store.set('peb_doctors', JSON.stringify(DEFAULT_DOCTORS));
  }
}
function getPatients(){ try { return JSON.parse(Store.get('peb_patients')||'{}'); } catch(e){ return {}; } }
function getDoctors(){ try { return JSON.parse(Store.get('peb_doctors')||'{}'); } catch(e){ return {}; } }
function savePatient(cpf, data){
  const db=getPatients(); db[cpf]=data; Store.set('peb_patients',JSON.stringify(db));
}
function saveDoctor(crm, data){
  const db=getDoctors(); db[crm]=data; Store.set('peb_doctors',JSON.stringify(db));
}
function lookupByCode(code){
  code = code.trim().toUpperCase();
  if(PATIENTS_MED[code]) return {...PATIENTS_MED[code], code};
  // Also check registered patients' codes
  const pts=getPatients();
  for(const cpf in pts){
    if(pts[cpf].code===code){
      // Return their medical data if exists in PATIENTS_MED, else return basic info
      return PATIENTS_MED[code] || null;
    }
  }
  return null;
}

// ══════════════════════════════════════════════
//  UTILS
// ══════════════════════════════════════════════
function fmtCPF(v){
  v=v.replace(/\D/g,'').slice(0,11);
  if(v.length>9) return v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/,'$1.$2.$3-$4');
  if(v.length>6) return v.replace(/(\d{3})(\d{3})(\d{1,3})/,'$1.$2.$3');
  if(v.length>3) return v.replace(/(\d{3})(\d{1,3})/,'$1.$2');
  return v;
}
function fmtCRM(v){return v.toUpperCase().replace(/[^0-9A-Z\/]/g,'').slice(0,10);}
function fmtPhone(v){
  v=v.replace(/\D/g,'').slice(0,11);
  if(v.length>7) return v.replace(/(\d{2})(\d{5})(\d{0,4})/,'($1) $2-$3');
  if(v.length>2) return v.replace(/(\d{2})(\d{0,5})/,'($1) $2');
  return v;
}
function validCPF(c){c=c.replace(/\D/g,'');return c.length===11&&!/^(\d)\1{10}$/.test(c);}
function validCRM(c){return /^\d{4,7}\/[A-Z]{2}$/.test(c.trim());}
function genProtocol(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';let r='EMG-';for(let i=0;i<7;i++)r+=c[Math.floor(Math.random()*c.length)];return r;}
function getInitials(n){return n.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();}
function pwCheck(p,name,doc){
  var low=p.toLowerCase(), clean=true;
  (name||'').toLowerCase().split(/\s+/).forEach(function(part){ if(part.length>=3 && low.indexOf(part)>=0) clean=false; });
  var digits=(doc||'').replace(/\D/g,'');
  if(digits.length>=4){ for(var i=0;i+4<=digits.length;i++){ if(p.indexOf(digits.slice(i,i+4))>=0){clean=false;break;} } }
  return{len:p.length>=8,upper:/[A-Z]/.test(p),lower:/[a-z]/.test(p),num:/[0-9]/.test(p),sym:/[^A-Za-z0-9]/.test(p),data:p.length>0&&clean};
}
function fmtCode(v){return v.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);}

function go(page,data={}){
  S.page=page; if(data) Object.assign(S,data);
  S.sidebarOpen=false; render(); window.scrollTo(0,0);
}

function render(){
  const app=document.getElementById('app');
  if(!app) return;
  let html='';
  switch(S.page){
    case 'login': html=pageLogin(); break;
    case 'register': html=pageRegister(); break;
    case 'forgot': html=pageForgot(); break;
    case 'patient-emergency': html=pagePatientEmergency(); break;
    case 'doctor-emergency': html=pageDoctorEmergency(); break;
    case 'emergency-loading': html=pageEmgLoading(); break;
    case 'emergency-confirm': html=pageEmgConfirm(); break;
    case 'emergency-data': html=pageEmgData(); break;
    case 'patient-home':case 'patient-appointments':case 'patient-exams':
    case 'patient-history':case 'patient-vaccines':case 'patient-doctors':
    case 'patient-insurance': html=appLayout('patient'); break;
    case 'doctor-home':case 'doctor-appointments':case 'doctor-exams':
    case 'doctor-history':case 'doctor-vaccines':case 'doctor-doctors':
    case 'doctor-insurance': html=appLayout('doctor'); break;
    default: html=pageLogin();
  }
  app.innerHTML=html;
  if(window.lucide) lucide.createIcons();
  if(window._afterRender){window._afterRender();window._afterRender=null;}
  if(S.openModal) renderModal();
  attachEvents();
}

//  REAL NFC IMPLEMENTATION
// ══════════════════════════════════════════════
let nfcReader = null;
let nfcAbortController = null;

async function doScanNFC(){
  if(!('NDEFReader' in window)){
    S.nfcError='NFC não suportado. Use Chrome no Android para esta funcionalidade.';
    render(); return;
  }
  S.nfcReading=true; S.nfcError=null; S.nfcResult=null; S.nfcPatient=null;
  render();
  try {
    nfcAbortController = new AbortController();
    nfcReader = new NDEFReader();
    await nfcReader.scan({signal: nfcAbortController.signal});
    nfcReader.addEventListener('reading', ({message, serialNumber}) => {
      let code = '';
      for(const record of message.records){
        try {
          const decoder = new TextDecoder(record.encoding || 'utf-8');
          const text = decoder.decode(record.data);
          code = text.trim().toUpperCase();
          break;
        } catch(e) {}
      }
      if(!code && serialNumber){
        // Use serial number as fallback code
        code = serialNumber.replace(/:/g,'').toUpperCase().slice(0,8);
      }
      const patient = lookupByCode(code);
      if(patient){
        S.nfcResult = code; S.nfcPatient = patient; S.nfcError = null;
      } else {
        S.nfcError = `Tag lida (${code}) — código não encontrado no sistema.`;
        S.nfcResult = code;
      }
      S.nfcReading = false;
      if(nfcAbortController) nfcAbortController.abort();
      render();
    });
    nfcReader.addEventListener('readingerror', () => {
      S.nfcError = 'Erro ao ler a tag. Tente novamente.';
      S.nfcReading = false; render();
    });
  } catch(err) {
    S.nfcReading = false;
    if(err.name === 'AbortError') { S.nfcReading = false; }
    else if(err.name === 'NotAllowedError') { S.nfcError = 'Permissão NFC negada. Conceda a permissão e tente novamente.'; }
    else if(err.name === 'NotSupportedError') { S.nfcError = 'NFC não disponível neste dispositivo.'; }
    else if(err.name === 'NotReadableError') { S.nfcError = 'NFC desativado. Ative o NFC nas configurações do celular.'; }
    else { S.nfcError = 'Erro NFC: ' + err.message; }
    render();
  }
}

function cancelNFC(){
  if(nfcAbortController){ nfcAbortController.abort(); nfcAbortController=null; }
  S.nfcReading=false; render();
}

function attachEvents(){
  document.querySelectorAll('[data-mask]').forEach(el=>{
    el.addEventListener('input',function(){
      const m=this.dataset.mask,v=this.value;
      if(m==='cpf') this.value=fmtCPF(v);
      else if(m==='crm') this.value=fmtCRM(v);
      else if(m==='phone') this.value=fmtPhone(v);
    });
  });
  const codeInputs=document.querySelectorAll('.code-input');
  if(codeInputs.length){
    codeInputs.forEach((inp,i)=>{
      inp.addEventListener('input',function(){
        this.value=this.value.replace(/\D/g,'').slice(-1);
        if(this.value&&i<5) codeInputs[i+1].focus();
      });
      inp.addEventListener('keydown',function(e){
        if(e.key==='Backspace'&&!this.value&&i>0) codeInputs[i-1].focus();
      });
    });
  }
  // Sincroniza campos com o estado para nunca perder o que foi digitado em re-renders
  function bindState(id, key){
    const el=document.getElementById(id);
    if(el) el.addEventListener('input', function(){ S[key]=this.value; });
  }
  bindState('login-doc','loginDoc'); bindState('login-pw','loginPw');
  bindState('reg-name','regName'); bindState('reg-doc','regDoc');
  bindState('reg-contact','regContact');
  const regPwcEl=document.getElementById('reg-pw-conf');
  if(regPwcEl){ regPwcEl.addEventListener('input',function(){S.regPwConf=this.value;render();setTimeout(()=>{const el=document.getElementById('reg-pw-conf');if(el){el.focus();const l=el.value.length;el.setSelectionRange(l,l);}},0);}); }
  const regPwEl=document.getElementById('reg-pw');
  if(regPwEl){ regPwEl.addEventListener('input',function(){S.regPw=this.value;const r=document.querySelector('.pw-criteria');if(!r&&!this.value) return;S.regPw=this.value;render();setTimeout(()=>{const el=document.getElementById('reg-pw');if(el){el.focus();const l=el.value.length;el.setSelectionRange(l,l);}},0);}); }
  const emgCodeEl=document.getElementById('emg-code');
  if(emgCodeEl){
    emgCodeEl.addEventListener('input',function(){
      const raw=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
      this.value=raw; S.emgCode=raw;
      if(raw.length===8){
        const p=lookupByCode(raw);
        if(p){S.emgCodeValid=true;S.emgCodePatient=p;}
        else{S.emgCodeValid=false;S.emgCodePatient=null;}
      } else {S.emgCodeValid=null;S.emgCodePatient=null;}
      render();
      setTimeout(()=>{const el=document.getElementById('emg-code');if(el){el.focus();const l=el.value.length;el.setSelectionRange(l,l);}},0);
    });
  }
}

document.addEventListener('click',function(e){
  const el=e.target.closest('[data-action]');if(!el) return;
  const action=el.dataset.action;
  switch(action){
    case 'login-mode': S.loginMode=el.dataset.mode; S.loginError=null; render(); break;
    case 'reg-mode': S.registerMode=el.dataset.mode; render(); break;
    case 'reg-contact': S.registerContact=el.dataset.val; render(); break;
    case 'forgot-method': S.forgotMethod=el.dataset.val; render(); break;
    case 'toggle-login-pw': S.loginPwVisible=!S.loginPwVisible; render(); break;
    case 'toggle-pw': S.pwVisible=!S.pwVisible; render(); break;
    case 'toggle-pw-conf': S.pwConfVisible=!S.pwConfVisible; render(); break;
    case 'goto-login': S.loginError=null; go('login'); break;
    case 'reg-done-login': S.regDone=false; S.loginError=null; go('login'); break;
    case 'goto-register': go('register',{registerMode:S.loginMode}); break;
    case 'goto-forgot': go('forgot',{forgotStep:1,forgotDone:false}); break;
    case 'goto-patient-emergency': go('patient-emergency'); break;
    case 'goto-doctor-emergency':
      S.emgCode=''; S.emgCodeValid=null; S.emgCodePatient=null;
      S.nfcResult=null; S.nfcPatient=null; S.nfcReading=false; S.nfcError=null;
      go('doctor-emergency'); break;
    case 'goto-doctor-home': go('doctor-home'); break;
    case 'login': doLogin(); break;
    case 'do-register': doRegister(); break;
    case 'forgot-next': doForgotNext(); break;
    case 'activate-patient-emg': doActivateEmg('patient'); break;
    case 'activate-doctor-emg': doActivateDoctorEmg(); break;
    case 'emg-method': S.emergencyMethod=el.dataset.val; S.nfcResult=null; S.nfcPatient=null; S.nfcReading=false; S.nfcError=null; S.emgCodeValid=null; render(); break;
    case 'scan-nfc': doScanNFC(); break;
    case 'cancel-nfc': cancelNFC(); break;
    case 'reset-nfc': S.nfcResult=null;S.nfcPatient=null;S.nfcReading=false;S.nfcError=null;render(); break;
    case 'nav': go(el.dataset.page); break;
    case 'open-sidebar': S.sidebarOpen=true; render(); break;
    case 'close-sidebar': S.sidebarOpen=false; render(); break;
    case 'logout': doLogout(); break;
    case 'open-modal': {try{S.openModal=JSON.parse(el.dataset.modal);}catch(err){}renderModal();} break;
    case 'close-modal': S.openModal=null;document.getElementById('modal-overlay')?.remove(); break;
    case 'toggle-patient': {const idx=parseInt(el.dataset.idx);S.patientExpanded[idx]=!S.patientExpanded[idx];render();break;}
    case 'toggle-hist-form': S.histFormOpen=!S.histFormOpen;S.histSuccess=false;render();break;
    case 'save-hist': S.histFormOpen=false;S.histSuccess=true;render();setTimeout(()=>{S.histSuccess=false;render();},3000);break;
    case 'set-filter': S.activeFilter=el.dataset.val;render();break;
  }
});

function doLogin(){
  const docEl=document.getElementById('login-doc');
  const pwEl=document.getElementById('login-pw');
  const doc=(docEl?.value||'').trim();
  const pw=pwEl?.value||'';
  const isDoc=S.loginMode==='doctor';
  if(!doc||!pw){S.loginError='Preencha todos os campos.';render();return;}
  const btn=document.getElementById('login-btn');
  if(btn){btn.textContent='Verificando...';btn.disabled=true;}
  if(isDoc){
    const docs=getDoctors();
    const found=docs[doc];
    if(!found){S.loginError='CRM não encontrado. Verifique ou crie uma conta.';render();return;}
    if(found.password!==pw){S.loginError='Senha incorreta.';render();return;}
    Store.set('peb_last_doctor_crm',doc);
    setTimeout(()=>{S.user={...found};Store.set('healthtrack_user',JSON.stringify(S.user));go('doctor-home');},600);
  } else {
    if(!validCPF(doc)){S.loginError='CPF inválido. Verifique e tente novamente.';render();return;}
    const pts=getPatients();
    const found=pts[doc];
    if(!found){S.loginError='CPF não cadastrado. Crie uma conta primeiro.';render();return;}
    if(found.password!==pw){S.loginError='Senha incorreta.';render();return;}
    setTimeout(()=>{S.user={...found};Store.set('healthtrack_user',JSON.stringify(S.user));go('patient-home');},600);
  }
}

function doRegister(){
  const nameEl=document.getElementById('reg-name');
  const docEl=document.getElementById('reg-doc');
  const pwEl=document.getElementById('reg-pw');
  const pwcEl=document.getElementById('reg-pw-conf');
  const name=(nameEl?.value||'').trim();
  const doc=(docEl?.value||'').trim();
  const pw=pwEl?.value||'';
  const pwc=pwcEl?.value||'';
  const isDoc=S.registerMode==='doctor';
  if(!name||!doc||!pw){S.regError='Preencha todos os campos obrigatórios.';render();return;}
  if(pw!==pwc){S.regError='As senhas não coincidem.';render();return;}
  if(pw.length<6){S.regError='A senha deve ter pelo menos 6 caracteres.';render();return;}
  if(isDoc){
    if(!validCRM(doc)){S.regError='CRM inválido. Use o formato: 123456/SP';render();return;}
    const docs=getDoctors();
    if(docs[doc]){S.regError='Este CRM já está cadastrado.';render();return;}
    saveDoctor(doc,{name,crm:doc,password:pw,type:'doctor'});
  } else {
    if(!validCPF(doc)){S.regError='CPF inválido.';render();return;}
    const pts=getPatients();
    if(pts[doc]){S.regError='Este CPF já está cadastrado.';render();return;}
    // Assign a random emergency code
    const chars='ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
    let code='';for(let i=0;i<8;i++) code+=chars[Math.floor(Math.random()*chars.length)];
    savePatient(doc,{name,cpf:doc,password:pw,code,type:'patient'});
  }
  const btn=document.querySelector('[data-action="do-register"]');
  if(btn){btn.textContent='Criando conta...';btn.disabled=true;}
  S.regError=null;
  setTimeout(()=>{
    // Tela de sucesso (PDF) — login fica pré-preenchido com a nova conta
    S.loginDoc=doc; S.loginPw=''; S.loginMode=isDoc?'doctor':'patient';
    S.regDone=true; S.regName=''; S.regDoc=''; S.regPw=''; S.regPwConf='';
    render();
  },800);
}

function doForgotNext(){
  if(S.forgotStep<3){S.forgotStep++;render();}
  else{S.forgotDone=true;render();}
}

function doActivateEmg(type){
  var cpf=document.getElementById('emg-cpf')?document.getElementById('emg-cpf').value.trim():'';
  var phone=document.getElementById('emg-phone')?document.getElementById('emg-phone').value.trim():'';
  var loc=document.getElementById('emg-loc')?document.getElementById('emg-loc').value.trim():'';
  var desc=document.getElementById('emg-desc')?document.getElementById('emg-desc').value.trim():'';
  if(!cpf||!phone||!loc){ alert('Preencha CPF, telefone e localização.'); return; }
  S.pEmg={cpf:cpf,phone:phone,loc:loc,desc:desc};
  S.emgProtocol=genProtocol();
  go('emergency-loading');
  setTimeout(function(){ go('emergency-confirm'); },2500);
}

function doActivateDoctorEmg(){
  const crm=document.getElementById('emg-crm')?.value||Store.get('peb_last_doctor_crm')||'';
  const unit=document.getElementById('emg-unit')?.value||'UPA';
  const proto=genProtocol();
  const patient = S.emergencyMethod==='nfc' ? S.nfcPatient : S.emgCodePatient;
  const codeUsed = S.emergencyMethod==='nfc' ? S.nfcResult : S.emgCode;
  if(!patient) return;
  if(crm) Store.set('peb_last_doctor_crm', crm);
  S.emgProtocol=proto; S.emgPatient=patient; S.emgCRM=crm; S.emgUnit=unit; S.emgCodeUsed=codeUsed;
  go('emergency-loading');
  setTimeout(()=>{ go('emergency-data'); },2500);
}

function doLogout(){

function showFatal(msg){
  const app=document.getElementById('app');
  if(app){
    app.innerHTML='<div style="padding:24px;color:#fca5a5;font-family:monospace;font-size:13px;line-height:1.6">'
      +'<strong style="color:#f87171;font-size:15px">Erro ao iniciar o app</strong><br><br>'
      +String(msg).replace(/</g,'&lt;')+'</div>';
  }
}
window.addEventListener('error',function(e){
  showFatal((e.error&&e.error.stack)||e.message||'Erro desconhecido');
});

function startApp(){
  try{
    initDB();
    const stored=Store.get('healthtrack_user');
    if(stored){try{S.user=JSON.parse(stored);}catch(e){S.user=null;}}
    if(S.user) go(S.user.type==='doctor'?'doctor-home':'patient-home');
    else go('login');
  }catch(err){
    showFatal((err&&err.stack)||err);
  }
}
